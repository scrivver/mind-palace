name: publish-images

on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: scrivver

jobs:
  build-and-push:
    strategy:
      matrix:
        target:
          - nix_target: mind-palace-app-container
            local_tag: mind-palace-app
            image_name: scrivver/mind-palace-app
            needs_pubspec_lock: true
          - nix_target: mind-palace-ingress-container
            local_tag: mind-palace-ingress
            image_name: scrivver/mind-palace-ingress
            needs_pubspec_lock: false

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Regenerate pubspec.lock.json
        if: ${{ matrix.target.needs_pubspec_lock }}
        run: ./bin/update-pubspec-lock-json

      - name: Build container image
        run: |
          image_path=$(nix build .#${{ matrix.target.nix_target }} --no-link --print-out-paths)
          docker load < "$image_path"

      - name: Tag image
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          docker tag ${{ matrix.target.local_tag }}:latest \
            "$REGISTRY/${{ matrix.target.image_name }}:sha-$short_sha"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            docker tag ${{ matrix.target.local_tag }}:latest \
              "$REGISTRY/${{ matrix.target.image_name }}:$version"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        run: |
          docker push --all-tags "$REGISTRY/${{ matrix.target.image_name }}"
